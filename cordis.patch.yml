# Loader patch for the dsh-remote-retry-llm-plugin bundle.
# Installs one Host plugin entry. The row name must match the package name.
# Tune behavior under `config`; see README for every option.
- insert:
    - id: retry-llm-plugin
      name: dsh-remote-retry-llm-plugin
      config:
        mode: normal
        maxRetries: 100
        backoff:
          initialDelayMs: 500
          maxDelayMs: 30000
          jitterRatio: 0.2
        respectProviderRetryAfter: true
        ssh:
          host: localhost
          port: 22
          username: ''
          identityFile: ''
          password: ''
          remoteDir: ''
